  deploy-to-wsl:
    needs: lint-and-build
    runs-on: self-hosted
    steps:
      - name: Update Web & Rebuild Nginx Container
        run: |
          # 1. Pindah ke folder web di home WSL dan pull commit terbaru
          cd $HOME/SAHABAT-SOS/sahabat-sos-web
          git pull origin main

          # 2. Pindah ke folder root Docker Compose
          cd $HOME/SAHABAT-SOS

          # 3. Rebuild container Web
          docker compose up -d --build web

          echo "✅ Web Admin Dashboard berhasil dideploy di WSL!"
